name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  tag:
    if: "!contains(github.event.head_commit.message, '[no ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get latest tag and commit SHA
        id: tag_check
        run: |
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest tag: $LATEST_TAG"
          # Get commit SHA of the latest tag
          TAG_COMMIT_SHA=$(git rev-list -n 1 $LATEST_TAG 2>/dev/null || echo "0000000")
          # Compare with current commit SHA
          if [ "$TAG_COMMIT_SHA" = "$GITHUB_SHA" ]; then
            echo "Current commit already tagged. Skipping new tag."
            echo "create_new_tag=false" >> $GITHUB_OUTPUT
          else
            echo "New commit detected. Creating new tag."
            echo "create_new_tag=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi
      - name: Increment version (if needed)
        if: steps.tag_check.outputs.create_new_tag == 'true'
        id: increment_version
        run: |
          LATEST_TAG="${{ steps.tag_check.outputs.latest_tag }}"
          # Split into major.minor.patch
          MAJOR=$(echo $LATEST_TAG | cut -d'.' -f1)
          MINOR=$(echo $LATEST_TAG | cut -d'.' -f2)
          PATCH=$(echo $LATEST_TAG | cut -d'.' -f3)
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      - name: Create new tag (if needed)
        if: steps.tag_check.outputs.create_new_tag == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const version = "${{ steps.increment_version.outputs.new_version }}";
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${version}`,
              sha: context.sha
            });

  build-publish:
    needs: [tag]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["crawl", "post", "send-dms"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Get Version
        id: version
        run: echo "version=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_OUTPUT
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v6.5.0
        with:
          context: .
          file: ${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/columnistosjs/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/columnistosjs/${{ matrix.service }}:latest
          build-args: |
            NODE_ENV=production

  deploy:
    needs: [build-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - name: Get version
        id: version
        run: echo "version=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_OUTPUT
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/wordpress-sites
            sed -i "s/^COLUMNISTOS_VERSION=.*/COLUMNISTOS_VERSION=${{ steps.version.outputs.version }}/" .env
            set -a && . ./.env && set +a
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_OWNER" --password-stdin
            docker compose pull crawl post send-dms
            docker compose up -d crawl post send-dms ofelia
            docker image prune -f
